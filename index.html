<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF Bites - Cantina Digital</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Sistema de Notificações -->
    <div id="toast"></div>

    <!-- 1. TELA INICIAL (SPLASH) -->
    <section id="screen-splash" class="screen active">
        <div class="logo-container">
            <h1>BF Bites</h1>
            <p>Sua cantina digital rápida e fácil</p>
        </div>
        <div style="width: 100%; max-width: 300px;">
            <button class="btn btn-gold" onclick="app.irParaLogin('aluno')">SOU ALUNO</button>
            <button class="btn btn-primary" onclick="app.irParaLogin('funcionario')">SOU FUNCIONÁRIO</button>
        </div>
    </section>

    <!-- 2. TELA DE LOGIN -->
    <section id="screen-login" class="screen">
        <div class="card">
            <h2 id="login-title">Identificação</h2>
            <div class="input-group">
                <label for="user-name">Nome de usuário</label>
                <input type="text" id="user-name" placeholder="Digite seu nome...">
            </div>
            <div class="input-group" id="password-group" style="display: none;">
                <label for="user-password">Senha</label>
                <input type="password" id="user-password" placeholder="Digite sua senha...">
            </div>
            <button id="btn-entrar-manual" class="btn btn-primary" onclick="app.fazerLogin()">ENTRAR</button>
            <button id="btn-google-login" class="btn btn-google" onclick="app.loginComGoogle()" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right: 8px; vertical-align: middle;">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                Entrar com o Google
            </button>
            <button class="btn btn-outline" onclick="app.voltarParaHome()">VOLTAR</button>
        </div>
    </section>

    <!-- 3. ÁREA DO ALUNO -->
    <section id="screen-aluno" class="screen">
        <header>
            <h1>Olá, <span id="display-aluno-name" class="gold-text">Aluno</span></h1>
            <p>O que vamos comer hoje?</p>
        </header>

        <div id="product-list" class="card" style="padding: 0;">
            <!-- Produtos serão injetados aqui via JS -->
        </div>

        <div id="meus-pedidos-container" style="display: none;">
            <h3 style="margin: 25px 0 15px;">📋 Meus Pedidos</h3>
            <div id="meus-pedidos-list">
                <!-- Cards de status dos pedidos serão injetados aqui via JS -->
            </div>
        </div>

        <div id="cart-container" class="cart-summary" style="display: none;">
            <div>
                <span id="cart-count">0</span> itens no carrinho
            </div>
            <button class="btn btn-gold" style="width: auto; margin: 0; padding: 10px 20px;" onclick="aluno.finalizarPedido()">
                FINALIZAR
            </button>
        </div>
        
        <button class="btn btn-outline" onclick="app.voltarParaHome()" style="margin-top: 20px;">SAIR</button>
    </section>

    <!-- 4. ÁREA DO FUNCIONÁRIO -->
    <section id="screen-funcionario" class="screen screen-funcionario">
        <div class="func-topbar">
            <div>
                <h1>Painel do Funcionário</h1>
                <p>Gerencie pedidos, estoque e caixa</p>
            </div>
            <button class="btn btn-gold btn-sm" style="width: auto; margin: 0;" onclick="app.voltarParaHome()">Sair</button>
        </div>

        <div id="funcionario-content" class="funcionario-content">
            <section id="pedidos-section" class="func-section active"></section>
            <section id="estoque-section" class="func-section"></section>
            <section id="caixa-section" class="func-section"></section>
        </div>

        <div class="func-footer-menu">
            <button class="btn btn-gold btn-sm active" data-tab="pedidos" onclick="funcionario.mostrarSecao('pedidos')">📋 Pedidos</button>
            <button class="btn btn-gold btn-sm" data-tab="estoque" onclick="funcionario.mostrarSecao('estoque')">📦 Estoque</button>
            <button class="btn btn-gold btn-sm" data-tab="caixa" onclick="funcionario.mostrarSecao('caixa')">💰 Caixa</button>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="pedidos.js"></script>
    <script src="aluno.js"></script>
    <script src="funcionario.js"></script>
    <script src="app.js"></script>
</body>
</html>
